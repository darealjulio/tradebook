<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TradeBook">
    <meta name="theme-color" content="#070b14">
    <meta name="description" content="Trading journal with P&L tracking, calendar heatmap, and reflection writing">

    <title>TradeBook</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/styles.css">

    <!-- Chart.js (lightweight CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </head>
  <body>
  <div id="splash-screen" style="position:fixed;inset:0;z-index:9999;background:#050d0f;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;pointer-events:none;">
    <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;">
      <div style="font-size:2.5rem;font-weight:700;color:#ffffff;letter-spacing:-0.02em;margin-bottom:0.25rem;">TradeBook</div>
      <div style="font-size:0.75rem;letter-spacing:0.2em;color:#6b7280;text-transform:uppercase;">Trading Journal</div>
    </div>
  </div>
  <style>
    #splash-screen.hidden { opacity: 0; pointer-events: none; }
  </style>
  <script>
    function hideSplash() {
      var s = document.getElementById('splash-screen');
      if (s) { s.classList.add('hidden'); setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 600); }
    }
    // Fallback: hide after 5s in case app never calls it
    setTimeout(hideSplash, 5000);
  </script>
    <div id="app"></div>
    <!-- Auth loads first, checks session, then loads app -->
    <script src="/auth.js"></script>
    <script src="/app.js"></script>
    <script src="/features.js"></script>
    <script src="/coach.js"></script>
    <script src="/analytics.js"></script>
  </body>
</html>
